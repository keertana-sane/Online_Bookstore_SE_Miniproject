name: Online Bookstore CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Run client tests (cart, checkout, orders)
        run: npm test

      - name: Build React application
        run: npm run build

  backend:
    name: Backend tests and syntax check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Check backend syntax
        run: node --check index.js

  backend-modules:
    name: Backend module tests (auth, cart, checkout, orders)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend module dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test
    postman:
    name: Postman API collection tests
    runs-on: ubuntu-latest
    needs: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Newman
        run: npm install --global newman

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Start API server
        working-directory: server
        env:
          PORT: 5000
          JWT_SECRET: ci-test-secret-not-for-production
          MONGO_URI: mongodb://127.0.0.1:27017/online_bookstore_ci
        run: |
          nohup node index.js > /tmp/bookstore-server.log 2>&1 &
          echo $! > /tmp/bookstore-server.pid

      - name: Wait for API server
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/api/health; then
              echo "API server is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bookstore-server.log
          exit 1

      - name: Run Postman collection
        run: newman run postman/catalog_collection.json --reporters cli